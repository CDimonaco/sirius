<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Sirius">
  <title>Sirius</title>
  <rect width="128" height="128" rx="28" fill="#151c25"/>

  <!-- base: a wedge, low at the front and rising to the back, the way the Sirio sits -->
  <path d="M20 58 Q20 53 25 52 L103 42 Q108 41 108 46 L108 108 Q108 112 104 112 L24 112 Q20 112 20 108 Z" fill="#eae6dd"/>
  <path d="M20 104 L108 104 L108 108 Q108 112 104 112 L24 112 Q20 112 20 108 Z" fill="#cfc9bd"/>

  <!-- display -->
  <rect x="62" y="52" width="40" height="15" rx="3" fill="#86c8b7"/>

  <!-- keypad -->
  <g fill="#333c46">
    <rect x="62" y="73" width="11" height="7" rx="2"/><rect x="76" y="73" width="11" height="7" rx="2"/><rect x="91" y="73" width="11" height="7" rx="2"/>
    <rect x="62" y="82" width="11" height="7" rx="2"/><rect x="76" y="82" width="11" height="7" rx="2"/><rect x="91" y="82" width="11" height="7" rx="2"/>
    <rect x="62" y="91" width="11" height="7" rx="2"/><rect x="76" y="91" width="11" height="7" rx="2"/><rect x="91" y="91" width="11" height="7" rx="2"/>
  </g>

  <!-- the red mark the original wore on its front -->
  <rect x="88" y="106" width="14" height="4" rx="2" fill="#d7263d"/>

  <!-- the recess the handset sits in -->
  <rect transform="rotate(-6 41 79)" x="13" y="65" width="56" height="28" rx="9" fill="#c7c0b2"/>

  <!-- coiled cord, hanging off the front left -->
  <path d="M24 92 c-11 5 -11 12 0 17 c8 4 9 8 7 11" fill="none" stroke="#39424d" stroke-width="5" stroke-linecap="round"/>

  <!-- handset resting across the cradle, tilted with the wedge -->
  <g transform="rotate(-6 41 79)">
    <path d="M25 69 H57 Q66 70 66 75 V83 Q66 88 57 89 H25 Q16 89 16 83 V75 Q16 70 25 69 Z" fill="#f7f5f0"/>
    <rect x="19" y="73" width="10" height="12" rx="3" fill="#a9a08e"/>
    <rect x="53" y="76" width="9" height="6" rx="3" fill="#a9a08e"/>
  </g>
</svg>
