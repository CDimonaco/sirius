<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Sirius: answer your meetings on a desk phone">
  <title>Sirius</title>
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4aa3c7" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#2d6f93" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#151c25" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="#151c25"/>

  <!-- the blue halo the original product shot was photographed against -->
  <ellipse cx="184" cy="150" rx="200" ry="150" fill="url(#halo)"/>

  <g transform="translate(70,38) scale(1.75)">
    <!-- base: a wedge, low at the front and rising to the back, the way the Sirio sits -->
    <path d="M20 58 Q20 53 25 52 L103 42 Q108 41 108 46 L108 108 Q108 112 104 112 L24 112 Q20 112 20 108 Z" fill="#eae6dd"/>
    <path d="M20 104 L108 104 L108 108 Q108 112 104 112 L24 112 Q20 112 20 108 Z" fill="#cfc9bd"/>

    <!-- display -->
    <rect x="62" y="52" width="40" height="15" rx="3" fill="#86c8b7"/>

    <!-- keypad -->
    <g fill="#333c46">
      <rect x="62" y="73" width="11" height="7" rx="2"/><rect x="76" y="73" width="11" height="7" rx="2"/><rect x="91" y="73" width="11" height="7" rx="2"/>
      <rect x="62" y="82" width="11" height="7" rx="2"/><rect x="76" y="82" width="11" height="7" rx="2"/><rect x="91" y="82" width="11" height="7" rx="2"/>
      <rect x="62" y="91" width="11" height="7" rx="2"/><rect x="76" y="91" width="11" height="7" rx="2"/><rect x="91" y="91" width="11" height="7" rx="2"/>
    </g>

    <!-- the red mark the original wore on its front -->
    <rect x="88" y="106" width="14" height="4" rx="2" fill="#d7263d"/>

    <!-- the recess the handset sits in, running front to back down the left side -->
    <rect x="24" y="56" width="28" height="47" rx="10" fill="#c7c0b2"/>

    <!-- coiled cord, dropping from the mouthpiece end -->
    <path d="M31 99 c-9 3 -10 8 -3 11 c7 3 3 7 -3 9" fill="none" stroke="#39424d" stroke-width="5" stroke-linecap="round"/>

    <!-- handset hung up, sitting the way it does when you put it back -->
    <path d="M33 60 H43 Q48 60 48 65 V94 Q48 99 43 99 H33 Q28 99 28 94 V65 Q28 60 33 60 Z" fill="#f7f5f0"/>
    <rect x="32" y="65" width="12" height="10" rx="3" fill="#a9a08e"/>
    <rect x="34" y="86" width="8" height="8" rx="4" fill="#a9a08e"/>
  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="392" y="150" fill="#f2efe8" font-size="94" font-weight="600" letter-spacing="16">SIRIUS</text>
    <rect x="396" y="176" width="72" height="5" rx="2.5" fill="#d7263d"/>
    <text x="396" y="220" fill="#8d99a8" font-size="27" letter-spacing="0.6">Answer your meetings on a desk phone</text>
  </g>
</svg>
