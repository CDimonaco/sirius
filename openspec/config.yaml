schema: spec-driven

context: |
  AGENTS.md has the project's hard constraints, tech stack and conventions, and
  docs/architecture/overview.md has the system design. Read both before authoring an
  artifact, and don't restate them inside a spec.

rules:
  proposal:
    - Say how the change avoids integrating with a meeting platform.
    - Include a "Non-goals" section.
  spec:
    - Scope requirements to observable behaviour, never to implementation detail.
      Name a component only where the requirement is genuinely about it.
    - Give audio-path requirements measurable criteria such as latency, sample drift
      or packet loss tolerance, rather than adjectives like "smooth" or "reliable".
    - Write scenarios a test can execute without a real phone or a real meeting, by
      stating the observable input and output at the process boundary.
