      <rect x="31" y="72" width="20" height="14" rx="3"/>
      <rect x="49" y="68" width="15" height="22" rx="4"/>
    </g>
  </g>

  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="392" y="150" fill="#f2efe8" font-size="94" font-weight="600" letter-spacing="16">SIRIUS</text>
    <rect x="396" y="176" width="72" height="5" rx="2.5" fill="#d7263d"/>
    <text x="396" y="220" fill="#8d99a8" font-size="27" letter-spacing="0.6">Answer your meetings on a desk phone</text>
